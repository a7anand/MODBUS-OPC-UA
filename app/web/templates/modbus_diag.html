{% extends "base.html" %}
{% block title %}Modbus analyzer{% endblock %}
{% block content %}
<h1>Modbus protocol analyzer</h1>
<form id="req">
  <label>Device <input name="device" id="device"/></label>
  <label>Unit <input name="unit_id" type="number" value="1"/></label>
  <label>Area <select name="area">
    <option>holding_register</option><option>input_register</option>
    <option>coil</option><option>discrete_input</option>
  </select></label>
  <label>Address <input name="address" type="number" value="0"/></label>
  <label>Count <input name="count" type="number" value="1"/></label>
  <button type="submit">Send</button>
</form>
<div class="tabs">
  <button data-tab="hex">RAW HEX</button>
  <button data-tab="bin">BINARY</button>
  <button data-tab="ascii">ASCII</button>
  <button data-tab="regs">REGISTERS</button>
  <button data-tab="json">JSON</button>
</div>
<pre id="out"></pre>
<p><a href="/diagnostics">Communication monitor</a> · <a href="/traffic">Traffic hex</a></p>
{% endblock %}
{% block scripts %}
<script>
const out = document.getElementById('out');
let view = 'hex';
document.querySelectorAll('.tabs button').forEach(b=>{
  b.onclick=()=>{ view=b.dataset.tab; renderLast(); };
});
let last = null;
function renderLast(){
  if(!last) return;
  const i = last.interpretation || {};
  if(view==='hex') out.textContent = i.hex || JSON.stringify(last.registers);
  else if(view==='bin') out.textContent = (i.binary||[]).join('\n');
  else if(view==='ascii') out.textContent = i.ascii || '';
  else if(view==='regs') out.textContent = JSON.stringify(i.decimal || last.registers, null, 2);
  else out.textContent = JSON.stringify(last, null, 2);
}
document.getElementById('req').onsubmit = async e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const body = {
    device: fd.get('device'),
    unit_id: +fd.get('unit_id'),
    area: fd.get('area'),
    address: +fd.get('address'),
    count: +fd.get('count'),
  };
  last = await fetch('/api/modbus/read',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json());
  renderLast();
};
fetch('/api/modbus/status').then(r=>r.json()).then(devs=>{
  if(devs[0]) document.getElementById('device').value = devs[0].name || '';
});
</script>
{% endblock %}
