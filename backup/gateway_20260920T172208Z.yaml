gateway:
  mode: production
  name: BKPL-GATEWAY-01
logging:
  json_logs: false
  level: INFO
mappings: []
modbus:
  devices:
  - address_base: one
    baudrate: 9600
    bytesize: 8
    connect_timeout_sec: 3.0
    enabled: true
    host: 127.0.0.1
    keepalive: true
    max_registers_per_request: 125
    mode: tcp_client
    name: SIm2
    parity: N
    port: 502
    reconnect_interval_sec: 5.0
    response_timeout_sec: 1.0
    retries: 3
    retry_delay_sec: 0.5
    serial_port: COM3
    stopbits: 1
    unit_id: 1
opcua:
  clients: []
  server:
    application_name: Modbus OPC UA Gateway
    application_uri: urn:modbus-opcua-gateway:server
    certificate_path: null
    enabled: false
    endpoint: opc.tcp://127.0.0.1:14842
    namespace_uri: urn:modbus-opcua-gateway:tags
    private_key_path: null
    security_mode: none
poll_groups:
- id: default
  interval_ms: 1000
  priority: 5
- id: fast
  interval_ms: 500
  priority: 5
