{% extends "base.html" %}
{% block title %}Certificates{% endblock %}
{% block content %}
<h1>Certificates</h1>
<pre id="list"></pre>
<form id="up"><input type="file" name="file"/><select name="store"><option>trusted</option><option>own</option><option>rejected</option></select><button>Import</button></form>
{% endblock %}
{% block scripts %}
<script>
function load(){fetch('/api/certificates').then(r=>r.json()).then(d=>{document.getElementById('list').textContent=JSON.stringify(d,null,2);});}
load();
document.getElementById('up').onsubmit=async e=>{
  e.preventDefault();
  const fd=new FormData(e.target);
  const store=e.target.store.value;
  await fetch('/api/certificates/import?store='+store,{method:'POST',body:fd});
  load();
};
</script>
{% endblock %}
