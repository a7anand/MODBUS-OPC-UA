[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aa-modbus-ua-gateway"
version = "3.0.0-dev"
description = "Industrial Modbus ↔ OPC UA Gateway (Core, PyQt GUI, embedded Web UI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aman Anand", email = "aman.anand@example.com" }]
dependencies = [
  "asyncua>=1.1.0,<3",
  "pymodbus>=3.6.0,<4",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "PyYAML>=6.0",
  "uvicorn>=0.30.0",
  "websockets>=12.0",
  "fastapi>=0.115.0",
  "python-multipart>=0.0.9",
  "pyserial>=3.5",
  "Jinja2>=3.1",
  "psutil>=5.9",
]

[project.optional-dependencies]
gui = ["PyQt5>=5.15"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "openpyxl>=3.1",
]
excel = ["openpyxl>=3.1"]
build = ["pyinstaller>=6.0"]

[project.scripts]
modbus-opcua-gateway = "app.cli:main"
aa-modbus-ua = "gateway.main:run_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "gateway*"]

[tool.setuptools.package-data]
app = ["web/static/*", "web/templates/*", "web/assets/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
